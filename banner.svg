<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- background -->
  <rect width="3840" height="2160" fill="#F2EEE3"/>
  
  <!-- main panel shadow -->
  <rect x="120" y="160" width="3600" height="1840" fill="#0A0A0A"/>
  <!-- main panel -->
  <rect x="80" y="120" width="3600" height="1840" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="12"/>
  
  <!-- top-left accent: NOTICE tag -->
  <rect x="80" y="120" width="420" height="110" fill="#FF5A36" stroke="#0A0A0A" stroke-width="12"/>
  <text x="290" y="195" font-size="42" fill="#FFFFFF" text-anchor="middle" font-weight="900" letter-spacing="3">NOTICE</text>
  
  <!-- top-right status -->
  <rect x="2820" y="120" width="860" height="110" fill="#FFDE59" stroke="#0A0A0A" stroke-width="12"/>
  <text x="3250" y="195" font-size="38" fill="#0A0A0A" text-anchor="middle" font-weight="900" letter-spacing="1">ACCOUNT MIGRATION</text>

  <!-- big heading -->
  <text x="160" y="400" font-size="130" fill="#0A0A0A" font-weight="900" letter-spacing="2">ACCOUNT MIGRATED</text>

  <!-- underline -->
  <rect x="160" y="440" width="1100" height="22" fill="#FF5A36" stroke="#0A0A0A" stroke-width="8"/>

  <!-- subtitle -->
  <text x="160" y="540" font-size="42" fill="#0A0A0A" font-weight="700" letter-spacing="1">@KADHIRAVANEG // SUSPENDED FOR 3 MONTHS - NOW RESTORED</text>

  <!-- tagline -->
  <text x="160" y="630" font-size="32" fill="#3D3A32" font-weight="700" letter-spacing="0.5">"THIS IS MY NEW ACTIVE ACCOUNT. ALL WORK HAS BEEN MIGRATED HERE FROM THE OLD ONE."</text>

  <!-- status chips -->
  <g font-size="28" font-weight="900" letter-spacing="1">
    <rect x="160" y="720" width="380" height="70" fill="#FF5A36" stroke="#0A0A0A" stroke-width="8"/>
    <text x="350" y="768" fill="#FFFFFF" text-anchor="middle">OLD ACCOUNT</text>

    <rect x="572" y="720" width="380" height="70" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="8"/>
    <text x="762" y="768" fill="#4FD1C5" text-anchor="middle">@KADHIRAVANEG</text>

    <rect x="985" y="720" width="80" height="70" fill="#FFDE59" stroke="#0A0A0A" stroke-width="8"/>
    <text x="1025" y="768" fill="#0A0A0A" text-anchor="middle">→</text>

    <rect x="1097" y="720" width="380" height="70" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="8"/>
    <text x="1287" y="768" fill="#0A0A0A" text-anchor="middle">THIS ACCOUNT</text>

    <rect x="1509" y="720" width="380" height="70" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="8"/>
    <text x="1699" y="768" fill="#FFDE59" text-anchor="middle">★ YOU ARE HERE</text>
  </g>

  <!-- instruction label -->
  <text x="160" y="900" font-size="26" fill="#7A7568" font-weight="900" letter-spacing="4">WANT TO SEE MY OLDER WORK? VISIT THE ORIGINAL PROFILE BELOW</text>

  <!-- visit chips -->
  <g font-size="26" font-weight="900" letter-spacing="1">
    <rect x="160" y="930" width="340" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
    <text x="330" y="972" fill="#0A0A0A" text-anchor="middle">VISIT OLD PROFILE</text>

    <rect x="522" y="930" width="420" height="60" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="7"/>
    <text x="732" y="972" fill="#4FD1C5" text-anchor="middle">github.com/KADHIRAVANEG</text>

    <rect x="975" y="930" width="80" height="60" fill="#FF5A36" stroke="#0A0A0A" stroke-width="7"/>
    <text x="1015" y="972" fill="#FFFFFF" text-anchor="middle">↗</text>
  </g>

  <!-- icons right side -->
  <!-- alert box -->
  <g transform="translate(2680,380) scale(3.2)">
    <rect x="0" y="0" width="90" height="90" fill="#FF5A36" stroke="#0A0A0A" stroke-width="4" transform="rotate(6 45 45)"/>
    <text x="45" y="62" font-size="52" fill="#FFFFFF" text-anchor="middle" font-weight="900" font-family="Arial Black">!</text>
  </g>

  <!-- arrow icon -->
  <g transform="translate(3080,400) scale(2.9)">
    <rect x="10" y="10" width="70" height="70" fill="#FFDE59" stroke="#0A0A0A" stroke-width="4"/>
    <text x="45" y="68" font-size="62" fill="#0A0A0A" text-anchor="middle" font-weight="900" font-family="Arial Black">→</text>
  </g>

  <!-- terminal icon -->
  <g transform="translate(3420,400) scale(2.9)">
    <rect x="0" y="0" width="90" height="90" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="4"/>
    <path d="M18 30 L38 45 L18 60" stroke="#0A0A0A" stroke-width="6" fill="none" stroke-linecap="square"/>
    <line x1="48" y1="62" x2="72" y2="62" stroke="#0A0A0A" stroke-width="6"/>
  </g>

  <!-- bottom divider -->
  <line x1="80" y1="1680" x2="3680" y2="1680" stroke="#0A0A0A" stroke-width="12"/>

  <!-- bottom info bar -->
  <g font-weight="900">
    <text x="160" y="1780" font-size="28" fill="#7A7568" letter-spacing="3">ORIGINAL HANDLE</text>
    <text x="160" y="1850" font-size="40" fill="#0A0A0A">@KADHIRAVANEG</text>

    <text x="900" y="1780" font-size="28" fill="#7A7568" letter-spacing="3">REASON</text>
    <text x="900" y="1850" font-size="40" fill="#0A0A0A">ACCOUNT FLAGGED</text>

    <text x="1750" y="1780" font-size="28" fill="#7A7568" letter-spacing="3">DURATION</text>
    <text x="1750" y="1850" font-size="40" fill="#0A0A0A">3 MONTHS</text>

    <text x="2550" y="1780" font-size="28" fill="#7A7568" letter-spacing="3">CURRENT ACCOUNT</text>
    <text x="2550" y="1850" font-size="40" fill="#0A0A0A">@JOKER-53 (THIS)</text>
  </g>

  <!-- visit old account pill -->
  <rect x="3080" y="1760" width="600" height="100" fill="#0A0A0A"/>
  <circle cx="3140" cy="1810" r="18" fill="#FF5A36"/>
  <text x="3400" y="1825" font-size="34" fill="#F2EEE3" text-anchor="middle" font-weight="900" letter-spacing="2">VISIT OLD ACCOUNT</text>
</svg>
