<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
  <!-- background -->
  <rect width="3840" height="2160" fill="#F2EEE3"/>
  
  <!-- main panel shadow -->
  <rect x="120" y="160" width="3600" height="1840" fill="#0A0A0A"/>
  <!-- main panel -->
  <rect x="80" y="120" width="3600" height="1840" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="12"/>
  
  <!-- top-left accent -->
  <rect x="80" y="120" width="420" height="110" fill="#FFDE59" stroke="#0A0A0A" stroke-width="12"/>
  <text x="290" y="195" font-size="42" fill="#0A0A0A" text-anchor="middle" font-weight="900" letter-spacing="3">WHOAMI</text>
  
  <!-- top-right status -->
  <rect x="3080" y="120" width="600" height="110" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="12"/>
  <text x="3380" y="195" font-size="38" fill="#0A0A0A" text-anchor="middle" font-weight="900" letter-spacing="1">SECURITY ENGINEER</text>
  
  <!-- name -->
  <text x="160" y="420" font-size="140" fill="#0A0A0A" font-weight="900" letter-spacing="2">KADHIRAVAN E G</text>
  
  <!-- underline -->
  <rect x="160" y="460" width="980" height="22" fill="#FF5A36" stroke="#0A0A0A" stroke-width="8"/>
  
  <!-- subtitle -->
  <text x="160" y="560" font-size="42" fill="#0A0A0A" font-weight="700" letter-spacing="1">B.E. CYBER SECURITY // FULL-STACK &amp; SYSTEMS ENGINEER</text>
  
  <!-- tagline -->
  <text x="160" y="640" font-size="32" fill="#3D3A32" font-weight="700" letter-spacing="0.5">"TURNING VULNERABILITIES INTO STRENGTHS — SECURE BY DESIGN."</text>
  
  <!-- skill chips -->
  <g font-size="28" font-weight="900" letter-spacing="1">
    <rect x="160" y="720" width="320" height="70" fill="#FFDE59" stroke="#0A0A0A" stroke-width="8"/>
    <text x="320" y="768" fill="#0A0A0A" text-anchor="middle">SECURE CODE</text>
    
    <rect x="510" y="720" width="320" height="70" fill="#FF5A36" stroke="#0A0A0A" stroke-width="8"/>
    <text x="670" y="768" fill="#0A0A0A" text-anchor="middle">VULN ASSESS</text>
    
    <rect x="860" y="720" width="220" height="70" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="8"/>
    <text x="970" y="768" fill="#0A0A0A" text-anchor="middle">LINUX</text>
    
    <rect x="1110" y="720" width="180" height="70" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="8"/>
    <text x="1200" y="768" fill="#0A0A0A" text-anchor="middle">CTF</text>
    
    <rect x="1320" y="720" width="280" height="70" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="8"/>
    <text x="1460" y="768" fill="#F2EEE3" text-anchor="middle">PENTESTING</text>
    
    <rect x="1630" y="720" width="320" height="70" fill="#FFDE59" stroke="#0A0A0A" stroke-width="8"/>
    <text x="1790" y="768" fill="#0A0A0A" text-anchor="middle">FULL-STACK DEV</text>
  </g>
  
  <!-- tech stack label -->
  <text x="160" y="880" font-size="26" fill="#7A7568" font-weight="900" letter-spacing="4">TECH STACK</text>
  
  <!-- tech chips -->
  <g font-size="26" font-weight="900" letter-spacing="1">
    <rect x="160" y="910" width="180" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
    <text x="250" y="952" fill="#0A0A0A" text-anchor="middle">PYTHON</text>
    
    <rect x="360" y="910" width="130" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
    <text x="425" y="952" fill="#0A0A0A" text-anchor="middle">C++</text>
    
    <rect x="510" y="910" width="160" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
    <text x="590" y="952" fill="#0A0A0A" text-anchor="middle">JS/TS</text>
    
    <rect x="690" y="910" width="190" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
    <text x="785" y="952" fill="#0A0A0A" text-anchor="middle">DOCKER</text>
    
    <rect x="900" y="910" width="160" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
    <text x="980" y="952" fill="#0A0A0A" text-anchor="middle">REACT</text>
    
    <rect x="1080" y="910" width="210" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
    <text x="1185" y="952" fill="#0A0A0A" text-anchor="middle">POSTGRES</text>
  </g>
  
  <!-- icons (right side) -->
  <!-- shield -->
  <g transform="translate(2680,380) scale(3.2)">
    <rect x="0" y="0" width="90" height="90" fill="#FFDE59" stroke="#0A0A0A" stroke-width="4" transform="rotate(6 45 45)"/>
    <polygon points="45,6 90,26 90,58 45,84 0,58 0,26" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="4"/>
    <path d="M30 40 L41 51 L62 28" stroke="#0A0A0A" stroke-width="6" fill="none" stroke-linecap="square"/>
  </g>
  
  <!-- padlock -->
  <g transform="translate(3080,400) scale(2.9)">
    <rect x="10" y="35" width="70" height="55" fill="#FF5A36" stroke="#0A0A0A" stroke-width="4"/>
    <path d="M25 35 V20 A20 20 0 0 1 65 20 V35" stroke="#0A0A0A" stroke-width="6" fill="none"/>
    <circle cx="45" cy="60" r="7" fill="#0A0A0A"/>
    <rect x="41" y="60" width="8" height="16" fill="#0A0A0A"/>
  </g>
  
  <!-- terminal -->
  <g transform="translate(3420,400) scale(2.9)">
    <rect x="0" y="0" width="90" height="90" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="4"/>
    <path d="M18 30 L38 45 L18 60" stroke="#0A0A0A" stroke-width="6" fill="none" stroke-linecap="square"/>
    <line x1="48" y1="62" x2="72" y2="62" stroke="#0A0A0A" stroke-width="6"/>
  </g>
  
  <!-- bottom divider -->
  <line x1="80" y1="1680" x2="3680" y2="1680" stroke="#0A0A0A" stroke-width="12"/>
  
  <!-- bottom info -->
  <g font-weight="900">
    <text x="160" y="1780" font-size="28" fill="#7A7568" letter-spacing="3">BASE</text>
    <text x="160" y="1850" font-size="40" fill="#0A0A0A">COIMBATORE, IN</text>
    
    <text x="900" y="1780" font-size="28" fill="#7A7568" letter-spacing="3">ROLE</text>
    <text x="900" y="1850" font-size="40" fill="#0A0A0A">SYSTEM UX ENGINEER</text>
    
    <text x="1750" y="1780" font-size="28" fill="#7A7568" letter-spacing="3">GITHUB</text>
    <text x="1750" y="1850" font-size="40" fill="#0A0A0A">@JOKER-53</text>
    
    <text x="2550" y="1780" font-size="28" fill="#7A7568" letter-spacing="3">CTF / PLATFORMS</text>
    <text x="2550" y="1850" font-size="40" fill="#0A0A0A">@JOKER53</text>
  </g>
  
  <!-- open to work pill -->
  <rect x="3080" y="1760" width="600" height="100" fill="#0A0A0A"/>
  <circle cx="3140" cy="1810" r="18" fill="#4FD1C5"/>
  <text x="3400" y="1825" font-size="34" fill="#F2EEE3" text-anchor="middle" font-weight="900" letter-spacing="2">OPEN TO WORK</text>
</svg>
